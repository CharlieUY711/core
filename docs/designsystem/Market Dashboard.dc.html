<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#EEECE5;}
</style>
</helmet>

<div style="font-family:'Archivo',sans-serif;display:flex;min-height:100vh;width:100%;background:#F0EFEA;">

  <!-- ===== SIDEBAR ===== -->
  <aside style="width:282px;flex:none;background:#0D2B55;display:flex;flex-direction:column;min-height:100vh;">

    <!-- brand -->
    <div style="padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:44px;height:44px;background:#fff;border-radius:22%;display:flex;align-items:center;justify-content:center;flex:none;"><span style="font-family:'Archivo Black';color:#3D5689;font-size:28px;line-height:1;">M</span></div>
        <div style="line-height:1;"><div style="font-family:'Archivo Black';color:#fff;font-size:21px;">MARKET</div><div style="font-size:10px;letter-spacing:.28em;color:#8FA0BC;font-weight:600;margin-top:3px;">ADMIN PANEL</div></div>
      </div>
    </div>

    <!-- user -->
    <div style="padding:22px 24px;display:flex;align-items:center;gap:13px;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="width:46px;height:46px;border-radius:50%;background:#314B6E;border:2px solid #3D5689;display:flex;align-items:center;justify-content:center;flex:none;"><span style="font-family:'Archivo Black';color:#fff;font-size:18px;">CV</span></div>
      <div style="line-height:1.3;"><div style="font-family:'Archivo',sans-serif;font-weight:700;color:#fff;font-size:15px;">Carlos Varalla</div><div style="font-size:12px;color:#8FA0BC;font-weight:600;">Administrador</div></div>
    </div>

    <!-- nav -->
    <nav style="padding:18px 16px;display:flex;flex-direction:column;gap:4px;flex:1;">
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:9px;text-decoration:none;background:#3D5689;color:#fff;font-weight:600;font-size:15px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
        Dashboard
      </a>
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:9px;text-decoration:none;color:#B9C4D6;font-weight:500;font-size:15px;" style-hover="background:rgba(255,255,255,.06);color:#fff;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
        Mis órdenes
      </a>
    </nav>

    <!-- logout -->
    <div style="padding:18px 24px 26px;">
      <a href="#" style="display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border-radius:9px;border:1px solid rgba(255,255,255,.16);text-decoration:none;color:#DDE4EF;font-weight:600;font-size:14px;" style-hover="background:rgba(255,255,255,.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Cerrar sesión
      </a>
    </div>

  </aside>

  <!-- ===== MAIN ===== -->
  <main style="flex:1;display:flex;flex-direction:column;min-width:0;">

    <!-- topbar -->
    <header style="background:#0D2B55;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex:none;">
      <h1 style="font-family:'Archivo',sans-serif;font-weight:700;color:#fff;font-size:24px;">Dashboard</h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="#" style="width:44px;height:44px;border-radius:9px;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;text-decoration:none;" style-hover="background:rgba(255,255,255,.06);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DDE4EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </a>
        <a href="#" style="height:44px;padding:0 24px;border-radius:9px;background:#3D5689;color:#fff;font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;" style-hover="background:#46639B;">Ver tienda</a>
      </div>
    </header>

    <!-- content -->
    <div style="padding:36px;flex:1;">

      <div style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8A8678;font-weight:600;margin-bottom:18px;">Resumen general</div>

      <!-- KPI grid -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;">

        <!-- card -->
        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#3D5689;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#3D5689;background:#EBEFF6;border-radius:100px;padding:5px 11px;">ÓRDENES TOTALES</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D5689" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">128</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#2E7D57;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#2E7D57;background:#EAF3EE;border-radius:100px;padding:5px 11px;">ÓRDENES PAGADAS</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">94</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#C2611F;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#C2611F;background:#F8EEE4;border-radius:100px;padding:5px 11px;">ÓRDENES PENDIENTES</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2611F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">34</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#1C6E86;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#1C6E86;background:#E6F0F3;border-radius:100px;padding:5px 11px;">REVENUE $U</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C6E86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">$U 412.350</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#7E3A70;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#7E3A70;background:#F2EAF0;border-radius:100px;padding:5px 11px;">PRODUCTOS ACTIVOS</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7E3A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">560</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#B23B30;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#B23B30;background:#F7E9E7;border-radius:100px;padding:5px 11px;">SIN STOCK</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B23B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">12</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#A85636;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#A85636;background:#F4ECE8;border-radius:100px;padding:5px 11px;">ML ACTIVOS</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A85636" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">488</div>
          </div>
        </div>

        <div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);">
          <div style="height:4px;background:#B23B30;"></div>
          <div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;color:#B23B30;background:#F7E9E7;border-radius:100px;padding:5px 11px;">ERRORES ML SYNC</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B23B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg></div>
            <div style="font-family:'Archivo Black';font-size:38px;color:#1C1B19;line-height:1;">3</div>
          </div>
        </div>

      </div>
    </div>

  </main>
</div>
</x-dc>
</body>
</html>
